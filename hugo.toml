baseURL = "https://chornthorn.github.io/tech/"
title = "Tech Blog"
enableGitInfo = true

defaultContentLanguage = "en"
locale = "en"

# Docsy theme module configuration
[module]
  [[module.imports]]
    path = "github.com/google/docsy/theme"
    disable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.renderhooks]
      [markup.goldmark.renderhooks.link]
        useembedded = 'fallback'
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "github-dark"
    tabWidth = 2

[params]
author = "Thorn Chorn"
copyright = "Tech Blog"
description = "Personal blog about Dart, Flutter, and software engineering."
github_repo = "https://github.com/chornthorn/tech"
github_project_repo = "https://github.com/chornthorn/tech"
offlineSearch = true
time_format_default = "January 2, 2006 at 3:04 PM MST"
time_format_blog = "January 2, 2006"

# UI configuration for navigation and sidebar
[params.ui]
sidebar_resizable = false
sidebar_menu_compact = false
sidebar_menu_foldable = true
sidebar_search_disable = false
sidebar_cache_limit = 1
ul_show = 3
breadcrumb_disable = false
navbar_logo = true
footer_about_enable = true
showLightDarkModeMenu = true
showlightdarkmodemenu = true

[params.links]
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/chornthorn/tech"
  icon = "fab fa-github"
  desc = "Site source and issue tracking"

[menu]
  [[menu.main]]
    name = "Blog"
    weight = 10
    url = "/blog/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/chornthorn/tech"
